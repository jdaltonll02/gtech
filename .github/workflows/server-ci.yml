name: Server CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_DB: pepper, POSTGRES_USER: pepper, POSTGRES_PASSWORD: pepper}
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U pepper" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: server}}
    env:
      DATABASE_URL: postgresql://pepper:pepper@localhost:5432/pepper
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json}
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run build
      - run: npm test
