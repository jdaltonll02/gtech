name: pepper
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pepper
      POSTGRES_USER: pepper
      POSTGRES_PASSWORD: pepper
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pepper -d pepper"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: ./infra/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pepper
      MINIO_ROOT_PASSWORD: pepper-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  create-bucket:
    image: amazon/aws-cli:2.17.57
    depends_on:
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: pepper
      AWS_SECRET_ACCESS_KEY: pepper-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: ["aws --endpoint-url http://minio:9000 s3api head-bucket --bucket pepper-media >/dev/null 2>&1 || aws --endpoint-url http://minio:9000 s3 mb s3://pepper-media"]
    restart: no
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./server
      target: development
    command: ["sh", "-c", "npm run db:migrate && npm run dev"]
    env_file: [.env]
    volumes: ["./server:/app", "/app/node_modules"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8000/api/v1/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: ./server
      target: development
    command: ["npm", "run", "worker"]
    env_file: [.env]
    volumes: ["./server:/app", "/app/node_modules"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes: ["./web:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  redis_data:
  minio_data:
