server {
    listen 80;
    server_name _;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/gibtechs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gibtechs.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker's internal DNS — required so nginx resolves 'api' at runtime
    resolver 127.0.0.11 valid=10s;

    # Don't advertise the nginx version in the Server header
    server_tokens off;

    # Match the backend's MAX_UPLOAD_BYTES (20 MB) with headroom — nginx's
    # default of 1 MB otherwise silently 413s any upload larger than that
    # (course thumbnails, resumes, product images, etc.) before it ever
    # reaches the API.
    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the FastAPI backend
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Server;
    }

    # Proxy media files
    location /media/ {
        set $upstream http://api:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_hide_header  Server;
    }

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
