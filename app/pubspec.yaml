publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter: {sdk: flutter}
  flutter_blurhash: ^0.9.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.3.0
